[package]
name = "lum"
version = "0.2.4"
edition = "2024"

[build-dependencies]
chrono = { version = "0.4.45", features = ["clock", "std"] }


[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.8"
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
flate2 = "1.1.9"
tar = "0.4.46"
xz2 = "0.1.7"
zip = "8.6.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
volumecontrol = "0.1.4"
which = "8.0.5"
ignore = "0.4.31"
chrono = { version = "0.4.45", features = ["clock", "std"] }
globset = "0.4.19"
notify-rust = "4.18.0"
sysinfo = "0.39.6"
rand = "0.10.2"
secrecy = { version = "0.10.3", features = ["serde"] }
url = "2"
gix-credentials = { version = "0.39", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
